<main>
  <h1>Blog</h1>
  <div id="posts"></div>
  <article id="detail" hidden>
    <button id="back">← all posts</button>
    <h2 id="title"></h2>
    <p id="body"></p>
    <h3>Comments</h3>
    <ul id="comments"></ul>
    <form id="form">
      <input name="author" placeholder="Your name" />
      <input name="body" placeholder="Say something nice" />
      <button>Post comment</button>
      <p id="error"></p>
    </form>
  </article>
</main>
